version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nexusrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_docker:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  ollama:
    image: ollama/ollama:latest
    container_name: nexusrag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama_models:/root/.ollama
    # For NVIDIA GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusrag-api
    restart: unless-stopped
    depends_on:
      - qdrant
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    environment:
      - NEXUSRAG_CONFIG_PATH=/app/config.yaml
      - OLLAMA_BASE_URL=http://ollama:11434
    command: ["uvicorn", "nexusrag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusrag-ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    environment:
      - NEXUSRAG_CONFIG_PATH=/app/config.yaml
    command: ["streamlit", "run", "nexusrag/ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
