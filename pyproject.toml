[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusrag"
version = "0.1.0"
description = "Production-grade, local-first, model-agnostic RAG system with verified citations and agentic retrieval"
authors = [{ name = "NexusRAG Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
    "qdrant-client>=1.7.0",
    "rank-bm25>=0.2.2",
    "torch>=2.1.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "networkx>=3.2.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]
ui = [
    "streamlit>=1.31.0",
]
advanced-parsers = [
    "tesseract",
]

[project.scripts]
nexusrag = "nexusrag.cli:app"

[tool.setuptools.packages.find]
include = ["nexusrag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

